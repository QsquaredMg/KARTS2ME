function esc(s){ return String(s).replace(/[&<>"']/g, function(c){ return {"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]; }); }

function urlBase64ToUint8Array(base64String){
  var padding = '='.repeat((4 - base64String.length % 4) % 4);
  var base64 = (base64String + padding).replace(/-/g, '+').replace(/_/g, '/');
  var rawData = atob(base64);
  var outputArray = new Uint8Array(rawData.length);
  for (var i = 0; i < rawData.length; ++i) outputArray[i] = rawData.charCodeAt(i);
  return outputArray;
}

async function enablePushNotifications(){
  if(!("serviceWorker" in navigator) || !("PushManager" in window)) return false;
  var perm = await Notification.requestPermission();
  if(perm !== "granted") return false;
  var reg = await navigator.serviceWorker.ready;
  var sub = await reg.pushManager.getSubscription();
  if(!sub){
    sub = await reg.pushManager.subscribe({
      userVisibleOnly: true,
      applicationServerKey: urlBase64ToUint8Array(VAPID_PUBLIC_KEY),
    });
  }
  var json = sub.toJSON();
  await sb.from("push_subscriptions").upsert({
    user_id: state.session.user.id, endpoint: json.endpoint,
    p256dh: json.keys.p256dh, auth: json.keys.auth,
  }, { onConflict: "endpoint" });
  return true;
}

async function loadAvailableLocations(){
  var zonesRes = await sb.from("zones").select("id,operator_id,name,active,operators(display_name,zone_display_name)").eq("active", true);
  var eventsRes = await sb.from("events").select("id,operator_id,zone_id,name,rider_access_mode,status,ends_at,operators(display_name)").eq("rider_access_mode", "open");
  var zones = (zonesRes.data || []).map(function(z){
    return { kind:"zone", id:z.id, operatorId:z.operator_id, name:z.name, operatorName: z.operators ? (z.operators.zone_display_name || z.operators.display_name) : "Karts2Me" };
  });
  var now = new Date();
  var events = (eventsRes.data || []).filter(function(e){
    return e.status !== "cancelled" && e.status !== "completed" && (!e.ends_at || new Date(e.ends_at) > now);
  }).map(function(e){
    return { kind:"event", id:e.zone_id, eventId:e.id, operatorId:e.operator_id, name:e.name, operatorName: e.operators ? e.operators.display_name : "Karts2Me" };
  });
  state.availableLocations = events.concat(zones);
}

async function fetchRoute(from, to){
  // Public OSRM demo server — fine for this stage, but rate-limited and not
  // meant for heavy production traffic. Self-hosting OSRM is the upgrade
  // path once volume justifies it.
  try{
    var url = "https://router.project-osrm.org/route/v1/driving/" + from[1] + "," + from[0] + ";" + to[1] + "," + to[0] + "?overview=false";
    var res = await fetch(url);
    var data = await res.json();
    if(data.code === "Ok" && data.routes && data.routes[0]){
      state.routeEtaMinutes = Math.max(1, Math.round(data.routes[0].duration / 60));
      state.routeDistanceMiles = (data.routes[0].distance / 1609.34).toFixed(1);
    } else {
      state.routeEtaMinutes = null;
      state.routeDistanceMiles = null;
    }
  } catch(e){
    state.routeEtaMinutes = null;
    state.routeDistanceMiles = null;
  }
}

async function loadZoneData(){
  if(!state.zoneId) return;
  var poisRes = await sb.from("points_of_interest").select("id,name,lat,lng").eq("zone_id", state.zoneId);
  state.pois = poisRes.data || [];
  if(state.pois.length){
    var sumLat = 0, sumLng = 0;
    state.pois.forEach(function(p){ sumLat += p.lat; sumLng += p.lng; });
    state.zoneCenter = [sumLat/state.pois.length, sumLng/state.pois.length];
  } else {
    state.zoneCenter = DEFAULT_ZONE_CENTER;
  }
  var priceRes = await sb.from("operator_pricing").select("*").eq("operator_id", state.operatorId).maybeSingle();
  state.pricing = priceRes.data;
}

function fareTotal(){
  var p = state.pricing;
  if(!p) return 0;
  var base = p.on_demand_base_cents/100;
  var perSeat = 2.00;
  var capacity = 4;
  var extra = state.buyout ? capacity-1 : state.seats-1;
  return base + perSeat*extra;
}

var geocodeDebounceTimer = null;
function searchAddress(query){
  clearTimeout(geocodeDebounceTimer);
  if(!query || query.trim().length < 3){
    state.addressResults = [];
    state.addressSearching = false;
    render();
    return;
  }
  state.addressSearching = true;
  render();
  geocodeDebounceTimer = setTimeout(function(){
    var center = state.zoneCenter || DEFAULT_ZONE_CENTER;
    var lat = center[0], lon = center[1];
    var delta = 0.06; // ~6-7km box around the property, biases results without hard-excluding nearby areas
    var viewbox = (lon-delta) + "," + (lat+delta) + "," + (lon+delta) + "," + (lat-delta);
    var url = "https://nominatim.openstreetmap.org/search?format=json&limit=6&addressdetails=0" +
      "&viewbox=" + viewbox + "&bounded=0&q=" + encodeURIComponent(query);
    fetch(url, { headers: { "Accept": "application/json" } })
      .then(function(res){ return res.json(); })
      .then(function(results){
        state.addressResults = results || [];
        state.addressSearching = false;
        render();
      })
      .catch(function(){
        state.addressResults = [];
        state.addressSearching = false;
        render();
      });
  }, 450);
}

async function createRide(){
  if(state.currentRideId) return;
  var t = fareTotal();
  var row = {
    mode: "on_demand", zone_id: state.zoneId, event_id: state.eventId, primary_rider_id: state.session.user.id,
    pickup_label: "Current location", dropoff_label: state.dest,
    dropoff_lat: state.destCoords ? state.destCoords[0] : null,
    dropoff_lng: state.destCoords ? state.destCoords[1] : null,
    seats_requested: state.seats, is_buyout: state.buyout,
    fare_cents: Math.round(t*100), status: "requested",
  };
  var res = await sb.from("rides").insert(row).select().single();
  if(res.data){
    state.currentRideId = res.data.id;
    fetch(SUPABASE_URL + "/functions/v1/notify-new-ride-request", {
      method: "POST",
      headers: { "Content-Type": "application/json", "Authorization": "Bearer " + state.session.access_token, "apikey": SUPABASE_ANON_KEY },
      body: JSON.stringify({ ride_id: res.data.id }),
    }).catch(function(){ /* notification failure shouldn't block the ride */ });
  }
}

async function createPaymentIntentForRide(rideId){
  var res = await fetch(SUPABASE_URL + "/functions/v1/create-payment-intent", {
    method: "POST",
    headers: {
      "Content-Type": "application/json",
      "Authorization": "Bearer " + state.session.access_token,
      "apikey": SUPABASE_ANON_KEY,
    },
    body: JSON.stringify({ ride_id: rideId }),
  });
  var data = await res.json();
  if(!res.ok) throw new Error(data.error || "Payment setup failed");
  return data.client_secret;
}

async function initPaymentScreen(){
  var statusEl = document.getElementById("paymentStatus");
  try{
    await createRide();
    var clientSecret = await createPaymentIntentForRide(state.currentRideId);
    elementsInstance = stripeClient.elements({ clientSecret: clientSecret });
    var paymentElement = elementsInstance.create("payment");
    paymentElement.mount("#payment-element");
    statusEl.style.display = "none";
    document.getElementById("payment-element").style.display = "block";
    var payBtn = document.getElementById("payBtn");
    payBtn.style.display = "block";
    payBtn.onclick = confirmPaymentClick;
  } catch(e){
    if(statusEl) statusEl.textContent = "Could not start payment: " + e.message;
  }
}

async function confirmPaymentClick(){
  var btn = document.getElementById("payBtn");
  var t = fareTotal();
  btn.disabled = true; btn.textContent = "Processing\u2026";
  var result = await stripeClient.confirmPayment({
    elements: elementsInstance,
    confirmParams: { return_url: window.location.href },
    redirect: "if_required",
  });
  if(result.error){
    var errEl = document.getElementById("paymentError");
    errEl.textContent = result.error.message;
    errEl.style.display = "block";
    btn.disabled = false; btn.textContent = "Pay $" + t.toFixed(2);
    return;
  }
  go("matching");
}

        '<button class="btn-primary" style="margin-bottom:10px;">Contact Driver</button>' +
        '<button id="simArrival" style="width:100%; background:none; border:none; font-size:13px; color:var(--coral); font-weight:600;">Cancel Ride</button>' +
        '<p style="font-size:10px; color:var(--slate); text-align:center; margin-top:10px;">(dev) button above simulates arrival &mdash; no live driver app yet</p>' +
      '</div>' +
    '</div>'
  );
}

function screenPost(){
  if(!state.showTip){
    return (
      '<div style="height:100%; display:flex; flex-direction:column; align-items:center; justify-content:center; padding:0 32px; text-align:center;">' +
        '<p class="display" style="font-size:18px; font-weight:600; margin-bottom:4px;">Rate your ride</p>' +
        '<p style="font-size:14px; color:var(--slate); margin-bottom:24px;">with ' + DRIVER.name + '</p>' +
        '<div style="display:flex; gap:8px; margin-bottom:32px;">' +
          [1,2,3,4,5].map(function(n){ return '<button class="star-btn" data-n="' + n + '" style="background:none; border:none; font-size:30px; opacity:' + (n<=state.rating?1:0.25) + ';">&#9733;</button>'; }).join("") +
        '</div>' +
        '<button id="toTip" class="btn-primary" style="max-width:200px;" ' + (state.rating===0?"disabled":"") + '>Continue</button>' +
      '</div>'
    );
  }
  return (
    '<div style="height:100%; display:flex; flex-direction:column; align-items:center; justify-content:center; padding:0 32px; text-align:center;">' +
      '<p class="display" style="font-size:18px; font-weight:600; margin-bottom:4px;">Add a tip?</p>' +
      '<p style="font-size:14px; color:var(--slate); margin-bottom:24px;">100% goes to ' + DRIVER.name + '</p>' +
      '<div style="display:flex; gap:10px; margin-bottom:32px;">' +
        [1,2,3].map(function(n){ return '<button class="tip-btn" data-n="' + n + '" style="padding:12px 20px; border-radius:12px; font-family:\'IBM Plex Mono\',monospace; font-weight:600; font-size:14px; border:none; background:' + (state.tip===n?"var(--ink)":"#F3F1EB") + '; color:' + (state.tip===n?"#fff":"var(--ink)") + ';">$' + n + '.00</button>'; }).join("") +
      '</div>' +
      '<button id="finishRide" class="btn-primary" style="max-width:200px;">Done</button>' +
    '</div>'
  );
}

function screenLoading(){
  return '<div style="height:100%; display:flex; align-items:center; justify-content:center;"><p class="mono" style="font-size:12px; color:var(--slate);">Loading&hellip;</p></div>';
}

function render(){
  var map = { loading:screenLoading, auth:screenAuth, forgotPassword:screenForgotPassword, resetPassword:screenResetPassword, terms:screenTerms, chooseLocation:screenChooseLocation, home:screenHome, search:screenSearch, mode:screenMode, confirm:screenConfirm,
    split:screenSplit, payment:screenPayment, matching:screenMatching, active:screenActive, post:screenPost };
  document.getElementById("screen").innerHTML = map[state.screen]();
  bind();
  if(state.screen==="home") setTimeout(function(){ mountMap("homeMap"); }, 0);
  if(state.screen==="mode") setTimeout(function(){ mountMap("modeMap"); }, 0);
  if(state.screen==="active") setTimeout(function(){ mountMap("activeMap"); }, 0);
}

function bind(){
  var s = state.screen;

  if(s==="auth"){
    document.getElementById("authToggle").onclick = function(){
      state.authMode = state.authMode==="login" ? "signup" : "login"; state.authError=null; render();
    };
    var forgotLink = document.getElementById("forgotPasswordLink");
    if(forgotLink) forgotLink.onclick = function(){ state.authError=null; state.forgotSent=false; go("forgotPassword"); };
    document.getElementById("authSubmit").onclick = async function(){
      var email = document.getElementById("authEmail").value.trim();
      var password = document.getElementById("authPassword").value;
      var res;
      if(state.authMode==="signup"){
        var name = document.getElementById("authName").value.trim();
        res = await sb.auth.signUp({ email:email, password:password, options:{ data:{ full_name:name, role:"rider" } } });
      } else {
        res = await sb.auth.signInWithPassword({ email:email, password:password });
      }
      if(res.error){ state.authError = res.error.message; render(); return; }
      if(!res.data.session){
        state.authError = "That email may already have an account. Check your inbox to confirm a new signup, or try logging in instead.";
        render();
        return;
      }
      state.session = res.data.session;
      await afterAuth();
    };
  }
  if(s==="forgotPassword"){
    var backBtn = document.getElementById("backToLoginBtn");
    if(backBtn) backBtn.onclick = function(){ state.authError=null; go("auth"); };
    var forgotSubmitBtn = document.getElementById("forgotSubmit");
    if(forgotSubmitBtn) forgotSubmitBtn.onclick = async function(){
      var email = document.getElementById("forgotEmail").value.trim();
      if(!email){ state.authError = "Enter your email address."; render(); return; }
      var res = await sb.auth.resetPasswordForEmail(email, { redirectTo: window.location.origin });
      if(res.error){ state.authError = res.error.message; render(); return; }
      state.authError = null;
      state.forgotSent = true;
      render();
    };
  }
  if(s==="resetPassword"){
    document.getElementById("resetSubmit").onclick = async function(){
      var pw = document.getElementById("newPassword").value;
      var confirm = document.getElementById("confirmPassword").value;
      if(pw.length < 6){ state.authError = "Password must be at least 6 characters."; render(); return; }
      if(pw !== confirm){ state.authError = "Passwords don't match."; render(); return; }
      var res = await sb.auth.updateUser({ password: pw });
      if(res.error){ state.authError = res.error.message; render(); return; }
      state.authError = null;
      await afterAuth();
    };
  }
  if(s==="terms"){
    document.getElementById("agreeCheckbox").onchange = function(e){ state.termsAgreed = e.target.checked; render(); };
    document.getElementById("continueBtn").onclick = async function(){
      if(!state.termsAgreed) return;
      await sb.from("profiles").update({ terms_accepted_at: new Date().toISOString(), terms_version: TERMS_VERSION }).eq("id", state.session.user.id);
      await loadAvailableLocations();
      go("chooseLocation");
    };
  }
  if(s==="chooseLocation"){
    document.querySelectorAll(".loc-btn").forEach(function(btn){
      btn.onclick = async function(){
        var l = state.availableLocations[Number(btn.dataset.idx)];
        state.zoneId = l.id;
        state.operatorId = l.operatorId;
        state.eventId = l.kind === "event" ? l.eventId : null;
        state.zoneName = l.name;
        state.operatorName = l.operatorName;
        await loadZoneData();
        go("home");
      };
    });
  }
  if(s==="home"){
    document.getElementById("goSearch").onclick = function(){ go("search"); };
    document.getElementById("logoutBtn").onclick = async function(){ await sb.auth.signOut(); location.reload(); };
    document.getElementById("changeLocationBtn").onclick = async function(){ await loadAvailableLocations(); go("chooseLocation"); };
    var pushBtn = document.getElementById("enablePushBtn");
    if(pushBtn) pushBtn.onclick = async function(){ var ok = await enablePushNotifications(); if(ok) render(); };
    var installBtn = document.getElementById("installAppBtn");
    if(installBtn) installBtn.onclick = async function(){
      if(!deferredInstallPrompt) return;
      deferredInstallPrompt.prompt();
      await deferredInstallPrompt.userChoice;
      deferredInstallPrompt = null;
      render();
    };
  }
  if(s==="search"){
    document.getElementById("backHome").onclick = function(){ go("home"); };
    document.getElementById("addressInput").oninput = function(e){
      state.addressQuery = e.target.value;
      searchAddress(state.addressQuery);
    };
    document.querySelectorAll(".addr-btn").forEach(function(btn){
      btn.onclick = async function(){
        var r = state.addressResults[Number(btn.dataset.idx)];
        state.dest = r.display_name.split(",")[0]; // short label for display
        state.destCoords = [parseFloat(r.lat), parseFloat(r.lon)];
        state.addressResults = [];
        state.addressQuery = "";
        if(state.zoneCenter) await fetchRoute(state.zoneCenter, state.destCoords);
        go("mode");
      };
    });
    document.querySelectorAll(".poi-btn").forEach(function(btn){
      btn.onclick = async function(){
        state.dest = btn.dataset.poi;
        state.destCoords = [parseFloat(btn.dataset.lat), parseFloat(btn.dataset.lng)];
        if(state.zoneCenter) await fetchRoute(state.zoneCenter, state.destCoords);
        go("mode");
      };
    });
  }
  if(s==="mode"){
    document.getElementById("backSearch").onclick = function(){ go("search"); };
    document.querySelectorAll(".mode-btn").forEach(function(btn){
      btn.onclick = function(){
        var mode = btn.dataset.mode;
        if(mode==="fixed_route") go("matching"); else go("confirm");
      };
    });
  }
  if(s==="confirm"){
    document.getElementById("backMode").onclick = function(){ go("mode"); };
    document.querySelectorAll(".seat-btn").forEach(function(btn){ btn.onclick = function(){ state.seats = Number(btn.dataset.seat); state.buyout = false; render(); }; });
    document.getElementById("buyoutBtn").onclick = function(){ state.buyout = !state.buyout; render(); };
    document.getElementById("openSplit").onclick = function(){ go("split"); };
    document.getElementById("requestBtn").onclick = function(){ go("payment"); };
  }
  if(s==="split"){
    document.getElementById("backConfirm").onclick = function(){ go("confirm"); };
    document.querySelectorAll(".confirm-btn").forEach(function(btn){ btn.onclick = function(){ state.people[Number(btn.dataset.idx)].status = "paid_confirmed"; render(); }; });
    var doneBtn = document.getElementById("splitDone"); if(doneBtn) doneBtn.onclick = function(){ go("payment"); };
    var departBtn = document.getElementById("splitDepart"); if(departBtn) departBtn.onclick = function(){ go("payment"); };
  }
  if(s==="payment"){
    var backBtn2 = document.getElementById("backConfirm2");
    if(backBtn2) backBtn2.onclick = function(){ go("confirm"); };
  }
  if(s==="active"){
    document.getElementById("simArrival").onclick = async function(){
      if(state.currentRideId){
        await sb.from("rides").update({ status:"completed", completed_at:new Date().toISOString() }).eq("id", state.currentRideId);
      }
      go("post");
    };
  }
  if(s==="post"){
    if(!state.showTip){
      document.querySelectorAll(".star-btn").forEach(function(btn){ btn.onclick = function(){ state.rating = Number(btn.dataset.n); render(); }; });
      var toTip = document.getElementById("toTip"); if(toTip) toTip.onclick = function(){ if(state.rating>0){ state.showTip = true; render(); } };
    } else {
      document.querySelectorAll(".tip-btn").forEach(function(btn){ btn.onclick = function(){ state.tip = Number(btn.dataset.n); render(); }; });
      document.getElementById("finishRide").onclick = function(){
        state.screen="home"; state.dest=null; state.destCoords=null; state.routeEtaMinutes=null; state.routeDistanceMiles=null; state.seats=1; state.buyout=false; state.rating=0; state.showTip=false; state.tip=null; state.currentRideId=null;
        state.people = [ { name:"You", status:"paid_confirmed" }, { name:"Maria", status:"paid_confirmed" }, { name:"Jake", status:"paid_unconfirmed" } ];
        render();
      };
    }
  }
}

async function afterAuth(){
  var profRes = await sb.from("profiles").select("terms_accepted_at").eq("id", state.session.user.id).single();
  if(profRes.data && profRes.data.terms_accepted_at){
    await loadAvailableLocations();
    go("chooseLocation");
  } else {
    go("terms");
  }
}

var deferredInstallPrompt = null;
window.addEventListener("beforeinstallprompt", function(e){
  e.preventDefault();
  deferredInstallPrompt = e;
  if(state.screen === "home") render();
});
window.addEventListener("appinstalled", function(){
  deferredInstallPrompt = null;
  if(state.screen === "home") render();
});
function isStandalone(){
  return window.matchMedia("(display-mode: standalone)").matches || window.navigator.standalone === true;
}

var recoveryHandled = false;
sb.auth.onAuthStateChange(function(event, session){
  if(event === "PASSWORD_RECOVERY"){
    recoveryHandled = true;
    state.session = session;
    go("resetPassword");
  }
});

async function boot(){
  await new Promise(function(resolve){ setTimeout(resolve, 150); });
  if(recoveryHandled) return;
  var sess = await sb.auth.getSession();
  state.session = sess.data.session;
  if(state.session){
    await afterAuth();
  } else {
    go("auth");
  }
}

if("serviceWorker" in navigator){
  window.addEventListener("load", function(){ navigator.serviceWorker.register("sw.js").catch(function(){}); });
}

boot();
</script>
</body>
</html>
